[build-system]
requires = [
    "wheel",
    "setuptools>=50.3.2",
    "setuptools_scm[toml]>=3.4",
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "src/saltext/kafka/version.py"
write_to_template = "__version__ = \"{version}\"\n"
fallback_version = "0.0.0"

[project]
name = "saltext.kafka"
description = "Salt Extension for interacting with Apache Kafka"
authors = [
    {name = "Saifuddin Rangwala", email = "saifuddin.rangwala@braodcom.com"},
]
keywords = [
    "salt-extension",
]
license = {text = "Apache Software License"}
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
]
requires-python = ">= 3.11"
dynamic = ["version"]
dependencies = [
    "salt>=3006",
    "kafka-python>=3.0.0",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/salt-extensions/saltext-kafka"
Documentation = "https://salt-extensions.github.io/saltext-kafka/"
Source = "https://github.com/salt-extensions/saltext-kafka"
Tracker = "https://github.com/salt-extensions/saltext-kafka/issues"

[project.optional-dependencies]
changelog = ["towncrier==26.9.0"]
dev = [
    "nox[uv]>=2024.3,!=2025.05.01",
    # prek is a fast drop-in replacement for pre-commit, but it only ships
    # prebuilt binaries for common platforms. Elsewhere (e.g. FreeBSD), the
    # dev automation falls back to pre-commit.
    "prek>=0.5.5 ; sys_platform == 'linux' or sys_platform == 'darwin' or sys_platform == 'win32'",
    "pre-commit>=2.21.0 ; sys_platform != 'linux' and sys_platform != 'darwin' and sys_platform != 'win32'",
]
# These dependencies are used in automations. It can be helpful
# to have them installed in the dev venv, e.g. for editor integration.
# When initializing the dev env using the included automation, pass
# `--extras` to install them automatically.
dev_extra = [
    "black==26.10.0",
    "isort==9.0.2",
    "coverage==7.16.2",
]
docs = [
  "sphinx",
  "sphinx-prompt",
  "sphinx-copybutton",
  "towncrier==26.9.0",
  "sphinxcontrib-towncrier",
  "myst_parser",
  "furo",
  "sphinx-inline-tabs",
]
docsauto = ["sphinx-autobuild"]
lint = [
    "pylint==4.1.3",
]
tests = [
    "pytest>=7.2.0",
    "pytest-salt-factories>=1.0.0",
    "pytest-instafail",
]

[project.entry-points."salt.loader"]
"saltext.kafka" = "saltext.kafka"

[tool.setuptools]
zip-safe = false
include-package-data = true
platforms = ["any"]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests"]

[tool.distutils.bdist_wheel]
# Use this option if your package is pure-python
universal = 1

[tool.distutils.sdist]
owner = "root"
group = "root"

[tool.build_sphinx]
source_dir = "docs"
build_dir = "build/sphinx"

[tool.black]
line-length = 100

[tool.isort]
force_single_line = true
skip = ["src/saltext/kafka/__init__.py"]
profile = "black"
line_length = 100

[tool.towncrier]
package = "saltext.kafka"
# An explicit name keeps towncrier from importing the package,
# allowing it to run without the project installed (release automation).
name = "saltext.kafka"
filename = "CHANGELOG.md"
template = "changelog/.template.jinja"
directory = "changelog/"
start_string = "# Changelog\n"
underlines = ["", "", ""]
title_format = "## {version} ({project_date})"
issue_format = "[#{issue}](https://github.com/salt-extensions/saltext-kafka/issues/{issue})"

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

# While we currently don't use ruff for linting, it's helpful to include
# these settings in case a user has setup ruff in their editor environment.
[tool.ruff]
builtins = [
    "__active_provider_name__",
    "__context__",
    "__env__",
    "__events__",
    "__executors__",
    "__ext_pillar__",
    "__file_client__",
    "__grains__",
    "__instance_id__",
    "__jid__",
    "__jid_event__",
    "__low__",
    "__lowstate__",
    "__minion__",
    "__opts__",
    "__pillar__",
    "__proxy__",
    "__reg__",
    "__resource__",
    "__resource_funcs__",
    "__ret__",
    "__runner__",
    "__runners__",
    "__running__",
    "__salt__",
    "__salt_system_encoding__",
    "__sdb__",
    "__serializers__",
    "__states__",
    "__tag__",
    "__thorium__",
    "__user__",
]
